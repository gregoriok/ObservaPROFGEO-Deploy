version: '3.8'

services:
  # --- Banco de Dados (PostGIS) ---
  db:
    image: postgis/postgis:15-3.4
    container_name: profgeo_db
    restart: always
    environment:
      POSTGRES_USER: usuario_profgeo
      POSTGRES_PASSWORD: senha_secreta
      POSTGRES_DB: banco_profgeo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # --- Backend (FastAPI) ---
  backend:
    build: ./BackendPROFGEO
    container_name: profgeo_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: usuario_profgeo
      DB_PASSWORD: senha_secreta
      DB_NAME: banco_profgeo
      PROJECT_NAME: "Observa-ProfGeo Docker"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost"
    ports:
      - "8000:8000"

  # --- Frontend (React) ---
  frontend:
    build: ./Front-End-Profgeo
    container_name: profgeo_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

  # --- GeoServer ---
  geoserver:
    image: kartoza/geoserver:2.24.2
    container_name: profgeo_geoserver
    restart: always
    depends_on:
      - db
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: admin
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
      INITIAL_MEMORY: 512m
      MAXIMUM_MEMORY: 1536m
      GEOSERVER_CSRF_DISABLED: "true"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    ports:
      - "8080:8080"

  # --- MapStore ---
  mapstore:
    image: geosolutionsit/mapstore2:2024.02.01
    container_name: profgeo_mapstore
    restart: always
    depends_on:
      - geoserver
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m"
    volumes:
      - mapstore_data:/opt/mapstore/data
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  geoserver_data:
  mapstore_data: